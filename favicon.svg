<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="body" x1="11" y1="13" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A9E9F4"/>
      <stop offset=".48" stop-color="#579CBF"/>
      <stop offset="1" stop-color="#244C78"/>
    </linearGradient>
    <linearGradient id="face" x1="13" y1="13" x2="43" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#243B58"/>
      <stop offset=".55" stop-color="#101D32"/>
      <stop offset="1" stop-color="#080F1D"/>
    </linearGradient>
    <linearGradient id="glass" x1="15" y1="15" x2="42" y2="43" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B3652"/>
      <stop offset="1" stop-color="#0A1526"/>
    </linearGradient>
    <linearGradient id="edge" x1="13" y1="48" x2="51" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#75DDF0"/>
      <stop offset="1" stop-color="#3874A7"/>
    </linearGradient>
    <filter id="shadow" x="0" y="4" width="68" height="64" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <filter id="glow" x="10" y="17" width="38" height="31" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.25" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="15" fill="#080D17"/>
  <ellipse cx="32" cy="52" rx="21" ry="5" fill="#000" opacity=".55" filter="url(#shadow)"/>

