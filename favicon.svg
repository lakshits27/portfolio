  <path d="m16.8 50.2 3.8 3.1q.9.7 2.1.3l27.5-8.5" stroke="#A5EAF5" stroke-opacity=".55" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Angled terminal display -->
  <path d="M11.7 15.1 41.9 7.2q2.7-.7 2.7 2.1v29.1q0 2.1-2 2.7l-30.2 9.3q-2.7.8-2.7-2V17.8q0-2 2-2.7Z" fill="url(#body)" stroke="#A5E9F4" stroke-width="1.1"/>
  <path d="m13.1 17.4 28-7.3v27.7l-28 8.6z" fill="url(#face)" stroke="#8AD8E9" stroke-opacity=".7" stroke-width=".8"/>
  <path d="m13.1 17.4 28-7.3v3.3l-28 7.4z" fill="#B5F0F7" opacity=".17"/>
  <path d="M16.8 22.2 37.5 16.8" stroke="#B9F2FA" stroke-opacity=".25" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Minimal terminal prompt, glowing softly -->
